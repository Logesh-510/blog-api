<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
        }

        .dashboard {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .card p {
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-container h2 {
            text-align: center;
            margin-top: 0;
        }

        #postChart {
            width: 100%;
            max-height: 500px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }

            .chart-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>User Dashboard</h1>

        <!-- Dashboard Cards -->
        <div class="cards">

            <div class="card">
                <h2>Total Posts</h2>
                <p id="totalPosts">0</p>
            </div>

            <div class="card">
                <h2>Total Comments</h2>
                <p id="totalComments">0</p>
            </div>

            <div class="card">
                <h2>Total Likes</h2>
                <p id="totalLikes">0</p>
            </div>

            <div class="card">
                <h2>Total Views</h2>
                <p id="totalViews">0</p>
            </div>

        </div>

        <!-- Chart -->
        <div class="chart-container">

            <h2>Likes and Comments Per Post</h2>

            <canvas id="postChart"></canvas>

        </div>

    </div>


    <script>

        // ============================================
        // JWT TOKEN
        // ============================================
        // Add a valid JWT token here for local testing.
        // Never commit a real token to GitHub.
        const token = "";

        // ============================================
        // LOAD DASHBOARD DATA
        // ============================================

        async function loadDashboard() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/user/dashboard/",
                    {
                        method: "GET",

                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Accept": "application/json"
                        }
                    }
                );


                // Check API response

                if (!response.ok) {

                    throw new Error(
                        `Dashboard API returned ${response.status}`
                    );

                }


                // Convert response to JSON

                const data = await response.json();


                // ============================================
                // UPDATE DASHBOARD CARDS
                // ============================================

                document.getElementById("totalPosts").textContent =
                    data.total_posts;

                document.getElementById("totalComments").textContent =
                    data.total_comments;

                document.getElementById("totalLikes").textContent =
                    data.total_likes_received;

                document.getElementById("totalViews").textContent =
                    data.total_views;


                // ============================================
                // PREPARE CHART DATA
                // ============================================

                const postTitles = data.posts.map(
                    post => post.title
                );

                const likes = data.posts.map(
                    post => post.likes
                );

                const comments = data.posts.map(
                    post => post.comments
                );


                // ============================================
                // CREATE BAR CHART
                // ============================================

                new Chart(
                    document.getElementById("postChart"),
                    {
                        type: "bar",

                        data: {

                            labels: postTitles,

                            datasets: [

                                {
                                    label: "Likes",
                                    data: likes
                                },

                                {
                                    label: "Comments",
                                    data: comments
                                }

                            ]

                        },

                        options: {

                            responsive: true,

                            plugins: {

                                legend: {
                                    position: "top"
                                }

                            },

                            scales: {

                                y: {

                                    beginAtZero: true,

                                    ticks: {
                                        precision: 0
                                    }

                                }

                            }

                        }

                    }
                );


            } catch (error) {

                console.error(
                    "Dashboard loading error:",
                    error
                );

            }

        }


        // ============================================
        // START DASHBOARD
        // ============================================

        loadDashboard();

    </script>

</body>
</html>
